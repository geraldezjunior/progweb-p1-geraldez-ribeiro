<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banco · Painel de clientes</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-body-tertiary">
    <header class="navbar bg-dark" data-bs-theme="dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Banco · Painel</span>
        <span class="navbar-text small">API em http://localhost:3000</span>
      </div>
    </header>

    <main class="container py-4">
      <section aria-labelledby="clientes-titulo">
        <h1 id="clientes-titulo" class="h3 mb-3">Clientes</h1>

        <!-- Feedback das ações (sucesso ou erro de regra vindo da API) -->
        <div id="clientes-aviso" aria-live="polite"></div>

        <div class="row g-4">
          <!-- Formulário: criar e editar -->
          <div class="col-lg-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h2 id="cliente-form-titulo" class="h5 card-title">Novo cliente</h2>
                <form id="cliente-form">
                  <div class="mb-3">
                    <label for="cliente-nome" class="form-label">Nome</label>
                    <input id="cliente-nome" name="nome" type="text" class="form-control" required maxlength="100" autocomplete="off" />
                  </div>
                  <div class="mb-3">
                    <label for="cliente-cpf" class="form-label">CPF</label>
                    <input id="cliente-cpf" name="cpf" type="text" class="form-control" required maxlength="11" inputmode="numeric" autocomplete="off" aria-describedby="cliente-cpf-ajuda" />
                    <div id="cliente-cpf-ajuda" class="form-text">11 dígitos, só números.</div>
                  </div>
                  <div class="d-flex gap-2">
                    <button id="cliente-salvar" type="submit" class="btn btn-primary">Cadastrar</button>
                    <button id="cliente-cancelar" type="button" class="btn btn-outline-secondary" hidden>Cancelar edição</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Lista com os quatro estados -->
          <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h2 class="h5 card-title mb-0">Lista de clientes</h2>
                  <button id="clientes-recarregar" type="button" class="btn btn-sm btn-outline-primary">Recarregar</button>
                </div>

                <!-- Estado 1: carregando -->
                <div id="clientes-carregando" class="estado text-center text-body-secondary">
                  <div class="spinner-border spinner-border-sm me-2" aria-hidden="true"></div>
                  <span role="status">Carregando clientes…</span>
                </div>

                <!-- Estado 2: vazio -->
                <div id="clientes-vazio" class="estado text-center text-body-secondary" hidden>
                  Nenhum cliente cadastrado ainda. Use o formulário para cadastrar o primeiro.
                </div>

                <!-- Estado 3: erro -->
                <div id="clientes-erro" class="alert alert-danger" role="alert" hidden>
                  <p class="mb-2"><strong>Não foi possível carregar a lista.</strong> <span id="clientes-erro-msg"></span></p>
                  <button id="clientes-tentar" type="button" class="btn btn-sm btn-danger">Tentar de novo</button>
                </div>

                <!-- Estado 4: sucesso -->
                <div id="clientes-sucesso" class="table-responsive" hidden>
                  <table class="table table-hover align-middle mb-0">
                    <thead>
                      <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">CPF</th>
                        <th scope="col" class="text-end">Ações</th>
                      </tr>
                    </thead>
                    <tbody id="clientes-tbody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
